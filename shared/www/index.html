<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emby Updater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0d0f14; --surface:#13161e; --border:#1e2330; --border2:#252a3a;
  --text:#c8cdd8; --muted:#5a6070; --accent:#00b36b; --accent2:#008f55;
  --blue:#4f8ef7; --orange:#f59e0b; --red:#ef4444; --green:#3ecf6e;
  --mono:'JetBrains Mono',monospace; --sans:system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px}

/* ── Top bar ── */
.topbar{width:100%;max-width:780px;display:flex;align-items:center;gap:12px;margin-bottom:24px}
.logo-icon{height:44px;display:flex;align-items:center;flex-shrink:0}
.logo-icon img{height:44px;width:auto}
.logo-text{display:flex;align-items:center;height:44px;padding-bottom:4px;gap:10px}
.logo-text span{font-family:'Nunito','Segoe UI',system-ui,sans-serif;font-size:2.4rem;font-weight:700;color:#e8eaf0;letter-spacing:-0.5px;line-height:1}
.app-ver{font-size:0.65rem;color:var(--muted);font-family:var(--mono);text-align:center;display:block;margin-top:3px}
.update-banner{width:100%;max-width:780px;background:rgba(79,142,247,.08);border:1px solid rgba(79,142,247,.25);border-radius:12px;padding:12px 16px;margin-bottom:14px;display:none;align-items:center;gap:12px}
.update-banner.show{display:flex}
.update-banner-text{flex:1;font-size:0.82rem;color:#e8eaf0}
.update-banner-text span{color:var(--blue);font-family:var(--mono);font-weight:600}
.btn-self-update{background:var(--blue);color:#fff;padding:8px 16px;border-radius:8px;border:none;font-size:0.78rem;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-self-update:hover{opacity:.85}
.btn-self-update:disabled{opacity:.4;cursor:not-allowed}
.spacer{flex:1}
.topbar-actions{display:flex;gap:8px;align-items:flex-start}
.logout-wrap{display:flex;flex-direction:column;align-items:center}
.lang-btn,.icon-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 10px;border-radius:7px;font-size:0.7rem;cursor:pointer;font-family:var(--mono);transition:color .15s,border-color .15s}
.lang-btn.active{border-color:var(--accent);color:var(--accent)}
.lang-btn:hover,.icon-btn:hover{color:var(--text);border-color:var(--border2)}
.icon-btn{padding:5px 9px;font-size:0.8rem}

/* ── Tabs ── */
.tabs{width:100%;max-width:780px;display:flex;gap:2px;margin-bottom:16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px}
.tab{flex:1;padding:9px;border-radius:9px;border:none;background:none;color:var(--muted);font-size:0.8rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:var(--sans)}
.tab.active{background:var(--border2);color:#e8eaf0}
.tab:hover:not(.active){color:var(--text)}

/* ── Card ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:780px;margin-bottom:14px}
.card-title{font-size:0.65rem;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:16px}

/* ── Version grid ── */
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vbox{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;position:relative;overflow:hidden}
.vbox::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.vbox.installed::before{background:var(--green)}
.vbox.stable::before{background:var(--blue)}
.vbox.beta::before{background:var(--orange)}
.vbox-label{font-size:0.63rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.vbox.installed .vbox-label{color:var(--green)}
.vbox.stable    .vbox-label{color:var(--blue)}
.vbox.beta      .vbox-label{color:var(--orange)}
.vbox-ver{font-family:var(--mono);font-size:1rem;font-weight:600;color:#e8eaf0;min-height:1.3em}
.vbox-sub{font-size:0.65rem;color:var(--muted);margin-top:3px;font-family:var(--mono)}

/* ── Buttons ── */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:9px;border:none;font-size:0.8rem;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s;font-family:var(--sans)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-check{background:var(--border2);color:var(--text)}
.btn-check:hover:not(:disabled){background:#2a3045}
.btn-stable{background:var(--blue);color:#fff}
.btn-stable:hover:not(:disabled){opacity:.85}
.btn-beta{background:linear-gradient(135deg,var(--orange),#e67e22);color:#fff}
.btn-beta:hover:not(:disabled){opacity:.85}
.btn-save{background:var(--accent);color:#fff}
.btn-save:hover:not(:disabled){background:var(--accent2)}
.btn-danger{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.btn-danger:hover:not(:disabled){background:rgba(239,68,68,.2)}

/* ── Progress ── */
.prog-wrap{margin-top:16px;display:none}
.prog-wrap.show{display:block}
.prog-label{font-size:0.7rem;font-family:var(--mono);color:var(--muted);margin-bottom:6px}
.prog-bg{background:var(--border);border-radius:99px;height:3px;overflow:hidden}
.prog-bar{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--blue));width:40%;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

/* ── Log ── */
.log{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;font-family:var(--mono);font-size:0.7rem;line-height:1.8;color:var(--muted);max-height:280px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;margin-top:14px;display:none}
.log.show{display:block}
.log .ok{color:var(--green)}.log .err{color:var(--red)}.log .warn{color:var(--orange)}.log .info{color:var(--blue)}

/* ── Schedule ── */
.sched-row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--bg);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;flex-wrap:wrap}
.sched-label{font-size:0.82rem;font-weight:600;color:#e8eaf0;flex:1;min-width:120px}
.sched-sub{font-size:0.68rem;color:var(--muted);font-family:var(--mono);margin-top:2px}
select,input[type=number]{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:8px;font-size:0.8rem;outline:none;cursor:pointer}
select:focus,input[type=number]:focus{border-color:var(--accent)}
input[type=number]{width:72px}
.toggle{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--border2);border-radius:99px;cursor:pointer;transition:.2s}
.slider::before{content:'';position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+.slider{background:var(--accent)}
.toggle input:checked+.slider::before{transform:translateX(20px)}
.cron-preview{font-family:var(--mono);font-size:0.7rem;color:var(--muted);background:rgba(79,142,247,.06);border:1px solid rgba(79,142,247,.15);border-radius:8px;padding:10px 14px;margin-top:12px;word-break:break-all}

/* ── Settings ── */
.settings-section{margin-bottom:24px}
.settings-title{font-size:0.65rem;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px}
.field{margin-bottom:14px}
.field label{display:block;font-size:0.7rem;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
input[type=text],input[type=password]{width:100%;padding:10px 13px;border-radius:9px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:0.88rem;outline:none;transition:border-color .15s}
input:focus{border-color:var(--accent)}
.reset-info{font-size:0.72rem;color:var(--muted);font-family:var(--mono);background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:12px 14px;line-height:1.7;margin-top:10px}
.reset-info code{color:var(--blue)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a2a1a;border:1px solid var(--green);color:var(--green);padding:10px 20px;border-radius:10px;font-size:0.8rem;font-family:var(--mono);opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}

/* ── Tab panels ── */
.panel{display:none}.panel.active{display:block}

@media(max-width:540px){.vgrid{grid-template-columns:1fr}.actions{flex-direction:column}.btn{justify-content:center}}
</style>
</head>

<!-- Tabs -->
<div class="tabs">
  <button class="tab active" id="tab-versions"  onclick="switchTab('versions')"></button>
  <button class="tab"        id="tab-schedule"  onclick="switchTab('schedule')"></button>
  <button class="tab"        id="tab-settings"  onclick="switchTab('settings')"></button>
</div>

<!-- ═══════════ VERSIONS TAB ═══════════ -->
<div class="panel active" id="panel-versions">
  <div class="card">
    <div class="card-title" id="lbl-versions-title">Wersje</div>
    <div class="vgrid">
      <div class="vbox installed">
        <div class="vbox-label" id="lbl-installed">Zainstalowana</div>
        <div class="vbox-ver" id="v-inst">—</div>
        <div class="vbox-sub" id="v-inst-sub">sprawdzanie...</div>
      </div>
      <div class="vbox stable">
        <div class="vbox-label" id="lbl-stable">Stable</div>
        <div class="vbox-ver" id="v-stable">—</div>
        <div class="vbox-sub" id="v-stable-sub">—</div>
      </div>
      <div class="vbox beta">
        <div class="vbox-label" id="lbl-beta">Beta</div>
        <div class="vbox-ver" id="v-beta">—</div>
        <div class="vbox-sub" id="v-beta-sub">—</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-check"  id="btn-check"  onclick="doCheck()"></button>
      <button class="btn btn-stable" id="btn-stable" onclick="doUpdate('stable')" disabled></button>
      <button class="btn btn-beta"   id="btn-beta"   onclick="doUpdate('beta')"   disabled></button>
    </div>
    <div class="prog-wrap" id="prog"><div class="prog-label" id="prog-label"></div><div class="prog-bg"><div class="prog-bar"></div></div></div>
  </div>
  <div class="card" id="log-card" style="display:none">
    <div class="card-title" id="lbl-log-title">Log</div>
    <div class="log show" id="log"></div>
  </div>
</div>

<!-- ═══════════ SCHEDULE TAB ═══════════ -->
<div class="panel" id="panel-schedule">
  <div class="card">
    <div class="card-title" id="lbl-sched-title">Harmonogram</div>

    <div class="sched-row">
      <div style="flex:1">
        <div class="sched-label" id="lbl-auto-update">Automatyczna aktualizacja</div>
        <div class="sched-sub" id="lbl-auto-sub">Włącz aby aktualizować Emby automatycznie</div>
      </div>
      <label class="toggle"><input type="checkbox" id="sched-enabled" onchange="schedChanged()"><span class="slider"></span></label>
    </div>

    <div id="sched-options" style="display:none">
      <div class="sched-row">
        <div class="sched-label" id="lbl-channel">Kanał</div>
        <select id="sched-channel" onchange="schedChanged()">
          <option value="stable">Stable</option>
          <option value="beta">Beta</option>
        </select>
      </div>

      <div class="sched-row">
        <div class="sched-label" id="lbl-frequency">Częstotliwość</div>
        <select id="sched-freq" onchange="schedChanged()">
          <option value="daily" id="opt-daily">Codziennie</option>
          <option value="weekly" selected id="opt-weekly">Co tydzień</option>
        </select>
      </div>

      <div class="sched-row" id="sched-day-row">
        <div class="sched-label" id="lbl-day">Dzień tygodnia</div>
        <select id="sched-day" onchange="schedChanged()">
          <option value="0" id="opt-sun">Niedziela</option>
          <option value="1" id="opt-mon">Poniedziałek</option>
          <option value="2" id="opt-tue">Wtorek</option>
          <option value="3" id="opt-wed">Środa</option>
          <option value="4" id="opt-thu">Czwartek</option>
          <option value="5" id="opt-fri">Piątek</option>
          <option value="6" id="opt-sat">Sobota</option>
        </select>
      </div>

      <div class="sched-row">
        <div class="sched-label" id="lbl-hour">Godzina (0–23)</div>
        <input type="number" id="sched-hour" min="0" max="23" value="3" onchange="schedChanged()">
      </div>

      <div class="cron-preview" id="cron-preview"></div>
    </div>

    <div class="actions" style="margin-top:18px">
      <button class="btn btn-save" id="btn-sched-save" onclick="saveSched()"></button>
    </div>
  </div>
</div>

<!-- ═══════════ SETTINGS TAB ═══════════ -->
<div class="panel" id="panel-settings">
  <div class="card">
    <div class="card-title" id="lbl-settings-title">Ustawienia</div>

    <div class="settings-section">
      <div class="settings-title" id="lbl-lang-section">Język / Language</div>
      <div class="actions">
        <button class="btn btn-check" onclick="changeLangSave('pl')" id="btn-lang-pl">🇵🇱 Polski</button>
        <button class="btn btn-check" onclick="changeLangSave('en')" id="btn-lang-en">🇬🇧 English</button>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-title" id="lbl-credentials">Dane logowania</div>
      <div class="field">
        <label id="lbl-new-user">Nowy użytkownik</label>
        <input type="text" id="new-username" autocomplete="off">
      </div>
      <div class="field">
        <label id="lbl-new-pass">Nowe hasło</label>
        <input type="password" id="new-password" autocomplete="new-password">
      </div>
      <div class="field">
        <label id="lbl-confirm-pass">Potwierdź hasło</label>
        <input type="password" id="confirm-password" autocomplete="new-password">
      </div>
      <div class="actions">
        <button class="btn btn-save" id="btn-save-creds" onclick="saveCreds()"></button>
        <button class="btn btn-danger" id="btn-logout-all" onclick="logoutAll()"></button>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-title" id="lbl-dl-section">Katalog pobierania</div>
      <div class="field">
        <label id="lbl-dl-path">Ścieżka</label>
        <input type="text" id="download-path" placeholder="/share/CACHEDEV1_DATA/Download" autocomplete="off">
      </div>
      <div class="hint" id="lbl-dl-hint" style="font-size:0.78rem;color:var(--muted);margin-top:4px"></div>
      <div class="actions">
        <button class="btn btn-save" id="btn-save-dl" onclick="saveDownloadPath()"></button>

    </div>

    <div class="settings-section">
      <div class="settings-title" id="lbl-reset-section">Reset hasła (SSH)</div>
      <div class="reset-info" id="reset-info-text"></div>
    </div>
  </div>
</div>

let lang = localStorage.getItem('eu_lang') || 'pl';
const t = k => T[lang][k] || k;

function applyLang() {
  const ids = ['tab-versions','tab-schedule','tab-settings',
    'lbl-versions-title','lbl-installed','lbl-stable','lbl-beta',
    'btn-check','btn-stable','btn-beta','lbl-log-title',

  const ri = document.getElementById('reset-info-text');

  document.getElementById('btn-en').classList.toggle('active', lang==='en');

  schedChanged();
}

function setLang(l) {

}

function changeLangSave(l) {
  setLang(l);
  api('POST', '/cgi-bin/api.cgi/settings', {language: l}).then(() => toast(t('toast-saved')));
}

// ═══════════════════════════════════════════════════════
// Tabs
// ═══════════════════════════════════════════════════════
let currentTab = 'versions';
function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}

// ═══════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════
let state = { installed:null, stableTag:null, stableName:null, betaTag:null, betaName:null, busy:false };

// ═══════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════
async function api(method, path, body=null) {
  const opts = { method, headers:{'Content-Type':'application/json'}, cache:'no-store', credentials:'include' };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (r.status === 401) { location='/login.html'; return {}; }
  return r.json();
}

function parseKV(text) {
  const r = {};
  if (!text) return {};
  for (const line of text.split('\n')) {
    const m = line.match(/^([A-Z_]+)=(.*)$/);
    if (m) r[m[1]] = m[2];
  }
  return r;
}

// ═══════════════════════════════════════════════════════
// Versions tab
// ═══════════════════════════════════════════════════════
function setBusy(busy, label='') {
  state.busy = busy;
  document.getElementById('btn-check').disabled  = busy;
  document.getElementById('btn-stable').disabled = busy || !state.stableTag;
  document.getElementById('btn-beta').disabled   = busy || !state.betaTag;
  const pw = document.getElementById('prog');
  pw.classList.toggle('show', busy);
  if (label) document.getElementById('prog-label').textContent = label;
}

function updateVersionButtons() {
  const bs = document.getElementById('btn-stable');
  const bb = document.getElementById('btn-beta');
  bs.textContent = state.stableTag ? `⬆ ${t('btn-stable').replace('⬆ ','')} ${state.stableTag}` : t('btn-stable');
  bb.textContent = state.betaTag   ? `🧪 ${t('btn-beta').replace('🧪 ','')} ${state.betaTag}`   : t('btn-beta');
}

function addLog(text, cls='') {
  const el = document.getElementById('log');
  const lines = text.split('\n').filter(l => l.trim());
  lines.forEach(line => {
    const s = document.createElement('span');
    s.className = cls || (/succ|UP_TO|SUCCESS/i.test(line) ? 'ok' : /BLAD|ERROR|FAILED/i.test(line) ? 'err' : /warn|NEWER/i.test(line) ? 'warn' : /pobier|install|sprawdz|check|Downlo/i.test(line) ? 'info' : '');
    s.textContent = line;
    el.appendChild(s);
    el.appendChild(document.createTextNode('\n'));
  });
  el.scrollTop = el.scrollHeight;
}

async function doCheck() {
  if (state.busy) return;
  document.getElementById('log').innerHTML = '';
  document.getElementById('log-card').style.display = 'block';
  document.getElementById('log').classList.add('show');
  setBusy(true, t('prog-check'));
  addLog('...', 'info');
  try {
    const d = await api('GET', '/cgi-bin/api.cgi/check');
    document.getElementById('log').innerHTML = '';
    addLog(d.output || '');
    const kv = parseKV(d.output || "");
    state.installed  = kv.INSTALLED;
    state.stableTag  = kv.STABLE_TAG;
    state.stableName = kv.STABLE_NAME;
    state.betaTag    = kv.BETA_TAG;
    state.betaName   = kv.BETA_NAME;
    document.getElementById('v-inst').textContent    = state.installed && state.installed!=='unknown' ? state.installed : '—';
    document.getElementById('v-inst-sub').textContent = state.installed && state.installed!=='unknown' ? t('v-inst-sub-ok') : t('v-inst-sub-err');
    document.getElementById('v-stable').textContent  = state.stableTag || '—';
    document.getElementById('v-stable-sub').textContent = state.stableName || '';
    document.getElementById('v-beta').textContent    = state.betaTag || '—';
    document.getElementById('v-beta-sub').textContent = state.betaName || '';
    updateVersionButtons();
    document.getElementById('btn-stable').disabled = state.busy || !state.stableTag;
    document.getElementById('btn-beta').disabled   = state.busy || !state.betaTag;
  } catch(e) { addLog(e.message, 'err'); }
  finally   { setBusy(false); }
}

async function doUpdate(channel) {
  if (state.busy) return;
  const ver = channel==='beta' ? state.betaTag : state.stableTag;
  if (!ver) return;
  const msg = t('confirm-update').replace('{v}',ver).replace('{ch}',channel);
  if (!confirm(msg)) return;
  document.getElementById('log').innerHTML = '';
  document.getElementById('log-card').style.display = 'block';
  document.getElementById('log').classList.add('show');
  setBusy(true, t('prog-update').replace('{}', ver));
  addLog(`→ ${ver} (${channel})`, 'info');
  try {
    const d = await api('POST', '/cgi-bin/api.cgi/update', {channel});
    addLog(d.output || '');
    if (/SUCCESS/.test(d.output))      addLog('✓ OK', 'ok');
    else if (/UP_TO_DATE/.test(d.output)) addLog(t('status-up-to-date'), 'ok');
    else if (/NEWER/.test(d.output))   addLog('ℹ Newer installed', 'warn');
    else if (/FAILED/.test(d.output))  addLog('✗ Failed', 'err');
    if (/SUCCESS/.test(d.output)) setTimeout(doCheck, 2000);
  } catch(e) { addLog(e.message,'err'); }
  finally   { setBusy(false); }
}

// ═══════════════════════════════════════════════════════
// Schedule tab
// ═══════════════════════════════════════════════════════
function schedChanged() {
  const enabled = document.getElementById('sched-enabled').checked;
  document.getElementById('sched-options').style.display = enabled ? 'block' : 'none';
  const freq = document.getElementById('sched-freq').value;
  document.getElementById('sched-day-row').style.display = freq==='weekly' ? 'flex' : 'none';
  updateCronPreview();
}

function updateCronPreview() {
  const el = document.getElementById('cron-preview');
  if (!document.getElementById('sched-enabled').checked) { el.style.display='none'; return; }
  el.style.display = 'block';
  const ch   = document.getElementById('sched-channel').value;
  const freq = document.getElementById('sched-freq').value;
  const hour = document.getElementById('sched-hour').value || 3;
  const day  = document.getElementById('sched-day').value;
  const act  = ch==='stable' ? 'update' : 'update-beta';
  const expr = freq==='daily' ? `0 ${hour} * * *` : `0 ${hour} * * ${day}`;
  el.textContent = `${expr} sh /share/CACHEDEV1_DATA/.qpkg/EmbyUpdater/emby-updater.sh ${act}`;
}

async function saveSched() {
  const data = {
    enabled:   document.getElementById('sched-enabled').checked,
    channel:   document.getElementById('sched-channel').value,
    frequency: document.getElementById('sched-freq').value,
    day:       parseInt(document.getElementById('sched-day').value),
    hour:      parseInt(document.getElementById('sched-hour').value)
  };
  const d = await api('POST', '/cgi-bin/api.cgi/schedule', data);
  toast(d.ok ? t('toast-saved') : t('toast-error'));
}

function loadSched(sched) {
  if (!sched) return;
  document.getElementById('sched-enabled').checked = sched.enabled || false;
  document.getElementById('sched-channel').value   = sched.channel || 'stable';
  document.getElementById('sched-freq').value      = sched.frequency || 'weekly';
  document.getElementById('sched-day').value       = String(sched.day ?? 0);
  document.getElementById('sched-hour').value      = String(sched.hour ?? 3);
  schedChanged();
}

// ═══════════════════════════════════════════════════════
// Settings tab
// ═══════════════════════════════════════════════════════
async function saveCreds() {
  const user = document.getElementById('new-username').value.trim();
  const pw1  = document.getElementById('new-password').value;
  const pw2  = document.getElementById('confirm-password').value;
  if (pw1 && pw1 !== pw2) { toast(t('toast-creds-mismatch')); return; }
  const body = {};
  if (user) body.username = user;
  if (pw1)  body.password = pw1;
  if (!Object.keys(body).length) return;
  const d = await api('POST', '/cgi-bin/api.cgi/settings', body);
  if (d.ok) {
    toast(t('toast-creds-ok'));
    document.getElementById('new-username').value = '';
    document.getElementById('new-password').value = '';
    document.getElementById('confirm-password').value = '';
  } else toast(t('toast-error'));
}

async function saveDownloadPath() {
  const path = document.getElementById('download-path').value.trim();
  const d = await api('POST', '/cgi-bin/api.cgi/settings', {download_path: path});
  if (d.ok) toast(t('toast-saved'));
  else toast(t('toast-error'));
}

async function checkSelfUpdate() {
  const d = await api('GET', '/cgi-bin/api.cgi/selfcheck');
  if (!d.ok || !d.update_available) return;
  const banner = document.getElementById('update-banner');
  document.getElementById('update-banner-text').innerHTML =
    t('self-update-avail').replace('{v}', d.latest);
  document.getElementById('btn-self-update').textContent = t('btn-self-update');
  banner.dataset.version = d.latest;
  banner.classList.add('show');
}

async function doSelfUpdate() {
  const btn = document.getElementById('btn-self-update');
  const ver = document.getElementById('update-banner').dataset.version;
  if (!confirm(`Update EmbyUpdater to v${ver}?\n\nThe app will restart automatically.`)) return;
  btn.disabled = true;
  btn.textContent = '⏳';
  const d = await api('POST', '/cgi-bin/api.cgi/selfupdate');
  if (d.ok) {
    btn.style.display = 'none';
    startReloadCountdown(d.version);
  } else {
    btn.disabled = false;
    btn.textContent = t('btn-self-update');
    toast(t('toast-error') + (d.error ? ': ' + d.error : ''));
  }
}

function startReloadCountdown(ver) {
  const textEl = document.getElementById('update-banner-text');
  const banner  = document.getElementById('update-banner');
  banner.classList.add('show');
  let secs = 35;
  function tick() {
    textEl.innerHTML = t('self-updating').replace('{v}', ver).replace('...', '') +
      ` — ${t('reloading-in')} <span>${secs}s</span>`;
    if (secs <= 0) { location.reload(); return; }
    secs--;
    setTimeout(tick, 1000);
  }
  tick();
}

async function doLogout() {
  await fetch('/cgi-bin/api.cgi/logout', {method:'POST', credentials:'include'});
  location='/login.html';
}

async function logoutAll() {
  const d = await api('POST', '/cgi-bin/api.cgi/settings', {logout_all: true});
  if (d.ok) { toast(t('toast-logged-out')); setTimeout(() => location='/login.html', 1500); }
}

// ═══════════════════════════════════════════════════════
// Toast
// ═══════════════════════════════════════════════════════
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ═══════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════
(async () => {
  applyLang();
  try {
    const d = await api('GET', '/cgi-bin/api.cgi/status');
    if (d.language) { lang = d.language; localStorage.setItem('eu_lang', lang); applyLang(); }
    const kv = parseKV(d.output || '');
    state.installed = kv.INSTALLED;
    const inst = document.getElementById('v-inst');
    const sub  = document.getElementById('v-inst-sub');
    if (state.installed && state.installed !== 'unknown') {
      inst.textContent = state.installed; sub.textContent = t('v-inst-sub-ok');
    } else {
      inst.textContent = '?'; sub.textContent = t('v-inst-sub-err');
    }
    // App version in header
    if (d.app_version) {
      document.getElementById('app-ver').textContent = 'v' + d.app_version;
    }
    if (d.schedule) loadSched(d.schedule);
    // populate config fields
    const cfg = await api('GET', '/cgi-bin/api.cgi/config');
    if (cfg) {
      document.getElementById('download-path').value = cfg.download_path || '';
    }
    // check for EmbyUpdater self-update
    checkSelfUpdate();
    // auto-check Emby versions on load
    doCheck();
  } catch(e) { /* silent */ }
})();
</script>
